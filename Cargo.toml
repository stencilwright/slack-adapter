[package]
name = "slack-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Browser-automation-backed API for Slack — use your own Slack programmatically (search first), built on apiwright."

[lib]
name = "slack_adapter"
path = "src/lib.rs"

[[bin]]
name = "slackctl"
path = "src/main.rs"

[dependencies]
# apiwright lives in the stencilwright monorepo (sibling checkout); re-exports the stencil crates.
apiwright = { path = "../stencilwright/crates/apiwright" }

tokio      = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
chrono     = { version = "0.4", features = ["serde"] }
